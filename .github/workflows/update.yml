name: Generate Live Market Calendar

on:
  schedule:
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install curl_cffi icalendar beautifulsoup4

      - name: Generate ICS File
        run: python generator.py

      - name: Commit and Publish Calendar
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@market.local"
          git add market_calendar.ics
          git commit -m "Live market data refresh [skip ci]" || exit 0
          git push
