name: Generate Live Market Calendar

on:
  schedule:
    - cron: '0 1,13 * * *'  # 06:30 AM & 06:30 PM IST
  workflow_dispatch:

concurrency:
  group: market-calendar-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 yfinance icalendar pytz

      - name: Execute Calendar Engine
        run: python generator.py

      - name: Commit and Push Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics
          git commit -m "Auto-refresh market feeds [skip ci]" || echo "No changes detected"
          git push origin main
